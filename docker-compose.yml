version: '3.8'

services:
  postgres:
    image: postgres
    restart: always
    container_name: db-phase-2
    environment:
      POSTGRES_USER: bitsolution
      POSTGRES_PASSWORD: bitsolution
      POSTGRES_DB: db_test
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    restart: always
    container_name: redis-phase-2
    ports:
      - "6379:6379"

  mailhog:
    image: mailhog/mailhog
    restart: always
    container_name: mailhog-phase-2
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  postgres_data: